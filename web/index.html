<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwiftArm Pro Controller</title>
    <meta name="description" content="Web-based control dashboard for SwiftArm Pro robot arm">
    
    <style>
        /* --- CSS Variables & Theme --- */
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --surface-color-hover: #2d2d2d;
            --primary-color: #00bcd4; /* Cyan for high contrast on dark */
            --primary-hover: #00acc1;
            --success-color: #4caf50;
            --warning-color: #ff9800;
            --danger-color: #d32f2f;
            --danger-hover: #b71c1c;
            --text-primary: #ffffff;
            --text-secondary: #b0b0b0;
            --border-color: #333333;
            --focus-ring: #00bcd4;
            --spacing-unit: 8px;
            --border-radius: 6px;
        }

        /* --- Reset & Base Styles --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.6;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- Grid Layout --- */
        .dashboard-container {
            display: grid;
            grid-template-columns: 300px 1fr 300px;
            grid-template-rows: auto 1fr auto;
            gap: 20px;
            padding: 20px;
            height: 100%;
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
        }

        /* Responsive Breakpoints */
        @media (max-width: 1024px) {
            .dashboard-container {
                grid-template-columns: 1fr 1fr;
                grid-template-rows: auto auto 1fr;
            }
            .sidebar-right {
                grid-column: 1 / -1;
                grid-row: 3;
            }
        }

        @media (max-width: 768px) {
            .dashboard-container {
                display: flex;
                flex-direction: column;
                height: auto;
                padding: 10px;
            }
        }

        /* --- Header & Status Bar --- */
        header {
            grid-column: 1 / -1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--surface-color);
            padding: 15px 20px;
            border-radius: var(--border-radius);
            border: 1px solid var(--border-color);
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-connected {
            background-color: rgba(76, 175, 80, 0.2);
            color: var(--success-color);
            border: 1px solid var(--success-color);
        }

        .status-disconnected {
            background-color: rgba(211, 47, 47, 0.2);
            color: var(--danger-color);
            border: 1px solid var(--danger-color);
        }

        /* --- Cards & Panels --- */
        .panel {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .panel-title {
            font-size: 1.1rem;
            color: var(--text-secondary);
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        /* --- Position Display --- */
        .position-display {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .axis-card {
            background-color: var(--bg-color);
            padding: 15px;
            border-radius: var(--border-radius);
            text-align: center;
            border: 1px solid var(--border-color);
        }

        .axis-label {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 5px;
        }

        .axis-value {
            font-size: 1.8rem;
            font-family: 'Courier New', monospace;
            color: var(--primary-color);
        }

        /* --- Inputs --- */
        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        input[type="number"], input[type="text"] {
            width: 100%;
            padding: 10px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            border-radius: var(--border-radius);
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        input[type="number"]:focus, input[type="text"]:focus {
            outline: none;
            border-color: var(--focus-ring);
            box-shadow: 0 0 0 2px rgba(0, 188, 212, 0.2);
        }

        /* --- Sliders --- */
        .slider-container {
            margin-bottom: 20px;
        }

        input[type="range"] {
            width: 100%;
            -webkit-appearance: none;
            background: transparent;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: var(--primary-color);
            cursor: pointer;
            margin-top: -8px;
        }

        input[type="range"]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            background: var(--border-color);
            border-radius: 2px;
        }
        
        input[type="range"]:focus {
            outline: none;
        }
        input[type="range"]:focus::-webkit-slider-thumb {
            box-shadow: 0 0 0 3px rgba(0, 188, 212, 0.3);
        }

        /* --- Buttons --- */
        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: var(--border-radius);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: #000;
        }
        .btn-primary:hover { background-color: var(--primary-hover); }

        .btn-secondary {
            background-color: var(--surface-color-hover);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }
        .btn-secondary:hover { background-color: #3d3d3d; }

        .btn-toggle {
            width: 100%;
            margin-bottom: 10px;
        }
        
        .btn-toggle.active {
            background-color: var(--success-color);
            color: white;
            border-color: var(--success-color);
        }

        /* --- Emergency Stop --- */
        .e-stop-container {
            grid-column: 1 / -1;
            display: flex;
            justify-content: center;
            padding: 20px;
            background-color: #2c0e0e;
            border: 2px solid var(--danger-color);
            border-radius: var(--border-radius);
            margin-top: auto;
        }

        .btn-estop {
            background-color: var(--danger-color);
            color: white;
            font-size: 1.5rem;
            font-weight: 700;
            padding: 20px 60px;
            border-radius: 50px;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(211, 47, 47, 0.5);
            border: 4px solid #b71c1c;
            letter-spacing: 2px;
        }

        .btn-estop:hover {
            background-color: var(--danger-hover);
            transform: scale(1.02);
        }

        .btn-estop:active {
            transform: scale(0.98);
            box-shadow: 0 2px 10px rgba(211, 47, 47, 0.3);
        }

        /* --- Notifications / Logs --- */
        #log-area {
            font-family: monospace;
            font-size: 0.85rem;
            color: var(--text-secondary);
            height: 150px;
            overflow-y: auto;
            background-color: var(--bg-color);
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
        }

        .log-entry { margin-bottom: 4px; }
        .log-error { color: #ff6b6b; }
        .log-info { color: #4db6ac; }

        /* Keyboard Toggle */
        .keyboard-toggle-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            background: var(--bg-color);
            padding: 10px;
            border-radius: var(--border-radius);
        }

        /* Accessibility focus visible override */
        :focus-visible {
            outline: 2px solid var(--focus-ring);
            outline-offset: 2px;
        }
    </style>
</head>
<body>

    <header>
        <h1>
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
            SwiftArm Pro
        </h1>
        <div style="display: flex; gap: 15px; align-items: center;">
            <span style="color: var(--text-secondary); font-size: 0.9rem;">COM11</span>
            <span id="connection-status" class="status-badge status-disconnected">Disconnected</span>
        </div>
    </header>

    <div class="dashboard-container">
        <!-- Left Panel: Settings & Status -->
        <aside class="panel">
            <h2 class="panel-title">Configuration</h2>
            
            <div class="slider-container">
                <label for="speed-slider">Speed: <span id="speed-val">1000</span> mm/min</label>
                <input type="range" id="speed-slider" min="1" max="2000" value="1000" aria-label="Arm Speed">
            </div>

            <div class="keyboard-toggle-wrapper">
                <input type="checkbox" id="kb-control-toggle" style="width: 20px; height: 20px;">
                <label for="kb-control-toggle" style="margin:0; cursor:pointer;">Enable Keyboard (Arrows)</label>
            </div>
            <p style="font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 20px;">
                Use Arrow Keys for X/Y.<br>
                Hold Shift for Z (Up/Down).
            </p>

            <h2 class="panel-title">End Effectors</h2>
            <button id="btn-gripper" class="btn btn-secondary btn-toggle" onclick="toggleGripper()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M2 6h20M2 18h20"/></svg>
                Gripper: <span id="gripper-state">OPEN</span>
            </button>
            <button id="btn-pump" class="btn btn-secondary btn-toggle" onclick="togglePump()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
                Suction Pump: <span id="pump-state">OFF</span>
            </button>
        </aside>

        <!-- Center Panel: Position Control -->
        <main class="panel" style="grid-column: span 2;"> <!-- Adjusted for 2-col layout in main -->
            <h2 class="panel-title">Position Control (G-Code Coordinates)</h2>
            
            <div class="position-display" role="group" aria-label="Current Robot Position">
                <div class="axis-card">
                    <div class="axis-label">X-AXIS</div>
                    <div class="axis-value" id="disp-x">0.00</div>
                </div>
                <div class="axis-card">
                    <div class="axis-label">Y-AXIS</div>
                    <div class="axis-value" id="disp-y">0.00</div>
                </div>
                <div class="axis-card">
                    <div class="axis-label">Z-AXIS</div>
                    <div class="axis-value" id="disp-z">0.00</div>
                </div>
            </div>

            <form id="move-form" onsubmit="handleMoveSubmit(event)">
                <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px;">
                    <div class="input-group">
                        <label for="input-x">Target X (50 - 320)</label>
                        <input type="number" id="input-x" min="50" max="320" step="0.1" required placeholder="X">
                    </div>
                    <div class="input-group">
                        <label for="input-y">Target Y (-200 - 200)</label>
                        <input type="number" id="input-y" min="-200" max="200" step="0.1" required placeholder="Y">
                    </div>
                    <div class="input-group">
                        <label for="input-z">Target Z (0 - 150)</label>
                        <input type="number" id="input-z" min="0" max="150" step="0.1" required placeholder="Z">
                    </div>
                </div>
                
                <div style="display: flex; gap: 10px; margin-top: 10px;">
                    <button type="submit" class="btn btn-primary" style="flex: 1;">
                        MOVE TO POSITION
                    </button>
                    <button type="button" class="btn btn-secondary" onclick="resetHome()">
                        HOME
                    </button>
                </div>
            </form>
            
            <div style="margin-top: 20px; flex-grow: 1;">
                <h2 class="panel-title">System Logs</h2>
                <div id="log-area">
                    <div class="log-entry log-info">[System] Dashboard initialized.</div>
                    <div class="log-entry log-info">[System] Waiting for connection...</div>
                </div>
            </div>
        </main>

        <!-- Emergency Stop Footer -->
        <div class="e-stop-container">
            <button class="btn-estop" onclick="emergencyStop()" aria-label="Emergency Stop">
                EMERGENCY STOP
            </button>
        </div>
    </div>

    <script>
        // --- Configuration ---
        const API_BASE = 'http://localhost:5000/api';
        const POLL_INTERVAL = 500; // ms
        
        // --- State ---
        let state = {
            connected: false,
            x: 150,
            y: 0,
            z: 50,
            gripper: false, // false = open
            pump: false,    // false = off
            speed: 1000
        };

        // --- DOM Elements ---
        const els = {
            status: document.getElementById('connection-status'),
            dispX: document.getElementById('disp-x'),
            dispY: document.getElementById('disp-y'),
            dispZ: document.getElementById('disp-z'),
            inputX: document.getElementById('input-x'),
            inputY: document.getElementById('input-y'),
            inputZ: document.getElementById('input-z'),
            speedSlider: document.getElementById('speed-slider'),
            speedVal: document.getElementById('speed-val'),
            gripperBtn: document.getElementById('btn-gripper'),
            gripperState: document.getElementById('gripper-state'),
            pumpBtn: document.getElementById('btn-pump'),
            pumpState: document.getElementById('pump-state'),
            logArea: document.getElementById('log-area'),
            kbToggle: document.getElementById('kb-control-toggle')
        };

        // --- Limits ---
        const LIMITS = {
            x: { min: 50, max: 320 },
            y: { min: -200, max: 200 },
            z: { min: 0, max: 150 }
        };

        // --- Logging Utility ---
        function log(msg, type = 'info') {
            const div = document.createElement('div');
            div.className = `log-entry log-${type}`;
            const time = new Date().toLocaleTimeString();
            div.textContent = `[${time}] ${msg}`;
            els.logArea.prepend(div);
        }

        // --- API Interaction ---
        async function apiCall(endpoint, method = 'POST', body = null) {
            try {
                const options = {
                    method,
                    headers: { 'Content-Type': 'application/json' }
                };
                if (body) options.body = JSON.stringify(body);

                // Note: This will fail in the preview iframe unless localhost is actually running
                const response = await fetch(`${API_BASE}${endpoint}`, options);
                
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                // If we get a response, we assume connected
                if (!state.connected) {
                    state.connected = true;
                    updateConnectionUI();
                }
                
                return await response.json();
            } catch (error) {
                // Handle connection lost
                if (state.connected) {
                    state.connected = false;
                    updateConnectionUI();
                    log('Connection lost to robot controller', 'error');
                }
                // Simulate success for UI testing if in preview mode (optional)
                // Remove the throw below to "fake" it for the demo
                 throw error; 
            }
        }

        function updateConnectionUI() {
            if (state.connected) {
                els.status.textContent = 'Connected';
                els.status.className = 'status-badge status-connected';
            } else {
                els.status.textContent = 'Disconnected';
                els.status.className = 'status-badge status-disconnected';
            }
        }

        // --- Status Polling ---
        async function pollStatus() {
            try {
                // In a real scenario: const data = await apiCall('/status', 'GET');
                // state.x = data.x; state.y = data.y; ...
                // For preview/demo purposes, we won't throw on poll fail to keep UI alive
                try {
                    // Simulating API call fail for preview
                    await fetch(`${API_BASE}/status`); 
                } catch (e) {
                    // Ignore poll errors for local preview logs
                }
            } catch (e) {
                console.warn('Poll failed');
            }
            updateDisplay();
        }

        // --- Actions ---

        function updateDisplay() {
            els.dispX.textContent = state.x.toFixed(2);
            els.dispY.textContent = state.y.toFixed(2);
            els.dispZ.textContent = state.z.toFixed(2);
            
            // Only update inputs if they aren't focused (to prevent overwriting user typing)
            if (document.activeElement !== els.inputX) els.inputX.value = state.x;
            if (document.activeElement !== els.inputY) els.inputY.value = state.y;
            if (document.activeElement !== els.inputZ) els.inputZ.value = state.z;
        }

        function validatePosition(x, y, z) {
            return {
                x: Math.max(LIMITS.x.min, Math.min(LIMITS.x.max, x)),
                y: Math.max(LIMITS.y.min, Math.min(LIMITS.y.max, y)),
                z: Math.max(LIMITS.z.min, Math.min(LIMITS.z.max, z))
            };
        }

        async function moveTo(x, y, z) {
            const target = validatePosition(x, y, z);
            
            // Optimistic UI update
            state.x = target.x;
            state.y = target.y;
            state.z = target.z;
            updateDisplay();

            log(`Moving to X:${target.x.toFixed(1)} Y:${target.y.toFixed(1)} Z:${target.z.toFixed(1)}`);
            
            try {
                await apiCall('/move', 'POST', { ...target, speed: state.speed });
            } catch (e) {
                log('Failed to send move command', 'error');
            }
        }

        function handleMoveSubmit(e) {
            e.preventDefault();
            const x = parseFloat(els.inputX.value);
            const y = parseFloat(els.inputY.value);
            const z = parseFloat(els.inputZ.value);
            moveTo(x, y, z);
        }

        async function toggleGripper() {
            state.gripper = !state.gripper;
            els.gripperState.textContent = state.gripper ? "CLOSED" : "OPEN";
            els.gripperBtn.classList.toggle('active', state.gripper);
            
            try {
                await apiCall('/gripper', 'POST', { state: state.gripper ? 'close' : 'open' });
            } catch (e) { log('Gripper command failed', 'error'); }
        }

        async function togglePump() {
            state.pump = !state.pump;
            els.pumpState.textContent = state.pump ? "ON" : "OFF";
            els.pumpBtn.classList.toggle('active', state.pump);

            try {
                await apiCall('/pump', 'POST', { state: state.pump ? 'on' : 'off' });
            } catch (e) { log('Pump command failed', 'error'); }
        }

        async function emergencyStop() {
            log('EMERGENCY STOP TRIGGERED', 'error');
            // Flash UI
            document.body.style.backgroundColor = '#500000';
            setTimeout(() => document.body.style.backgroundColor = '', 200);

            try {
                await apiCall('/stop', 'POST');
            } catch (e) { 
                console.error("Stop signal failed to send"); 
            }
        }

        function resetHome() {
            moveTo(150, 0, 100);
        }

        // --- Event Listeners ---
        
        els.speedSlider.addEventListener('input', (e) => {
            state.speed = parseInt(e.target.value);
            els.speedVal.textContent = state.speed;
        });

        // Keyboard Control
        document.addEventListener('keydown', (e) => {
            if (!els.kbToggle.checked) return;
            
            // Ignore if typing in an input
            if (e.target.tagName === 'INPUT') return;

            const STEP = 5; // mm per keypress
            let { x, y, z } = state;
            let moved = false;

            if (e.key === 'ArrowUp') { y += STEP; moved = true; }
            if (e.key === 'ArrowDown') { y -= STEP; moved = true; }
            if (e.key === 'ArrowRight') { x += STEP; moved = true; }
            if (e.key === 'ArrowLeft') { x -= STEP; moved = true; }
            
            // Optional Z axis with Shift
            if (e.shiftKey && e.key === 'ArrowUp') { z += STEP; y -= STEP; /* cancel y change */ moved = true; }
            if (e.shiftKey && e.key === 'ArrowDown') { z -= STEP; y += STEP; /* cancel y change */ moved = true; }

            if (moved) {
                e.preventDefault();
                moveTo(x, y, z);
            }
        });

        // Start Polling
        setInterval(pollStatus, POLL_INTERVAL);
        
        // Initial log
        log('Controller ready. Please enable keyboard control to jog.');
    </script>
</body>
</html>
